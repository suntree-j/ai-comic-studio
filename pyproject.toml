[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-studio"
version = "0.1.0"
description = "把小说自动改编成漫画：受 Schema 约束的 Comic IR + AI 改漫 Agent + 确定性渲染"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AI Comic Studio contributors" }]
keywords = ["comic", "manga", "llm", "agent", "storyboard", "text-to-comic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
comic = "packages.cli:main"

[tool.setuptools]
packages = ["packages", "packages.ir", "packages.agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
