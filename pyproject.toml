[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-comic-studio"
version = "0.1.0"
description = "把小说自动改编成漫画：受 Schema 约束的 Comic IR + AI 改漫 Agent + 确定性渲染"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "AI Comic Studio contributors" }]
keywords = ["comic", "manga", "llm", "agent", "storyboard", "text-to-comic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "Pillow>=10.0",
    "numpy>=1.24",
    # 用 cmap 精确判断字体是否含中文字形。
    # 没有它时无法可靠区分「中文字体」与「拉丁字体」——
    # 曾因此让线上气泡中文全变方块（见 packages/render/page.py::_has_cjk）
    "fonttools>=4.40",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
# 工作台后端（apps/api）
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
comic = "packages.cli:main"

# ★ 用自动发现而不是手写列表 —— 手写列表曾经漏掉 packages.render，
#   导致安装后 import 失败（本地因为直接跑源码目录所以没暴露）
[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
